# X16: every push and pull request touching web/ is checked the way a contributor checks locally —
# typecheck, lint, format, unit tests, the three builds (demo, real, standalone; L01: the real one fails
# without its variables), the SQL tests on a
# Supabase-like Postgres, and Lighthouse on a phone profile. The standalone preview is published as an
# artifact (it is no longer kept in Git).
name: web

on:
  push:
    paths: ["web/**", "legal/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "legal/**", ".github/workflows/web.yml"]
  # L03: o E2E no staging também roda à mão (Actions › web › Run workflow).
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # L05: as Edge Functions (Deno) também passam pelo verificador de tipos. Numa cópia fora de web/ para o
      # Deno não confundir o node_modules do app com o das funções.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Tipos das Edge Functions
        run: cp -r supabase/functions "$RUNNER_TEMP/functions" && cd "$RUNNER_TEMP/functions" && deno check */index.ts
      - name: Build (demonstração)
        run: npm run build:demo
      # L01: o build de produção sem as variáveis tem de falhar (nunca sai um app de demonstração por engano).
      - name: Build de produção sem variáveis falha
        run: |
          if npx vite build --outDir dist-sem-env > build-sem-env.log 2>&1; then
            echo "O build de produção passou sem as variáveis" && exit 1
          fi
          grep -q "Build de produção interrompido" build-sem-env.log && cat build-sem-env.log | head -8
      # R01: com todas as variáveis, o build de PRODUÇÃO ainda para enquanto os textos legais tiverem campos
      # {{…}} ou faltar a revisão do advogado. O build real do CI é o de staging (só avisa).
      - name: Build de produção com textos legais incompletos falha
        run: |
          if npx vite build --outDir dist-sem-juridico > build-juridico.log 2>&1; then
            if grep -q "{{" src/services/legal.ts || grep -q "LEGAL_REVIEWED = false" src/services/legal.ts; then
              echo "O build de produção passou com os textos legais incompletos" && exit 1
            fi
          else
            grep -q "textos jurídicos incompletos" build-juridico.log && head -6 build-juridico.log
          fi
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SITE_URL: https://bicos.example.com
          VITE_TURNSTILE_SITE_KEY: ci-placeholder
          VITE_SENTRY_DSN: https://ci@sentry.example.com/1
          VITE_SUPORTE_WHATSAPP: "11987654321"
      - name: Build (modo real, staging)
        run: npm run build:staging -- --outDir dist-real
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SITE_URL: https://bicos.example.com
          VITE_TURNSTILE_SITE_KEY: ci-placeholder
          VITE_SENTRY_DSN: https://ci@sentry.example.com/1
          VITE_SUPORTE_WHATSAPP: "11987654321"
      - name: Build (prévia que abre do disco)
        run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: bicos-preview
          path: web/dist-standalone/index.html
      - name: Lighthouse (celular)
        run: |
          npx --yes lighthouse@12.8.2 --version
          (npx vite preview --port 4173 --strictPort &) && sleep 3
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://localhost:4173/ --quiet --form-factor=mobile \
              --throttling-method=devtools --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path=lighthouse-$i.json
          done
          node scripts/lighthouse-check.mjs lighthouse-1.json lighthouse-2.json lighthouse-3.json
      - name: Acessibilidade (axe, WCAG 2.1 AA)
        run: |
          npm i --no-save axe-core@4.10.3
          npx playwright install chromium
          curl -sf http://localhost:4173/ > /dev/null || ((npx vite preview --port 4173 --strictPort &) && sleep 3)
          node scripts/a11y-check.mjs
          # U21: as mesmas telas no tema escuro.
          A11Y_TEMA=escuro node scripts/a11y-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse-*.json
          if-no-files-found: ignore

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Postgres do Supabase + migrations
        run: ./supabase/tests/local/setup.sh
      - name: Testes SQL
        run: node supabase/tests/run.mjs supabase/tests/[a-z]*.sql
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      # X14: os tipos do banco no app (src/types/database.generated.ts) têm de estar iguais às migrations.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: APLICAR-TUDO.sql em dia
        run: node scripts/aplicar-tudo.mjs && git diff --exit-code -- supabase/APLICAR-TUDO.sql
      - name: Tipos do banco em dia
        run: npm run gen:types && git diff --exit-code -- src/types/database.generated.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres

  # L03: os fluxos de ponta a ponta (web/e2e) no STAGING, com contas criadas e apagadas pelo próprio teste.
  # Roda no master e à mão. Sem os segredos do staging (E2E_*), avisa e termina sem falhar.
  e2e:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: [checks, sql]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_ANON_KEY: ${{ secrets.E2E_ANON_KEY }}
      E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      E2E_EMAIL_BASE: ${{ secrets.E2E_EMAIL_BASE }}
    steps:
      - name: Segredos do staging
        id: cfg
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$E2E_SUPABASE_URL" ] || [ -z "$E2E_SERVICE_ROLE_KEY" ]; then
            echo "::warning::E2E pulado: faltam os segredos E2E_* do staging (web/e2e/LEIA.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.cfg.outputs.ok == 'true'
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build do app apontando para o staging
        if: steps.cfg.outputs.ok == 'true'
        run: npx vite build --mode e2e --outDir dist-e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_ANON_KEY }}
          VITE_SITE_URL: http://localhost:4173
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_SENTRY_DSN: https://e2e@sentry.invalid/1
          VITE_SUPORTE_WHATSAPP: "11987654321"
      - name: E2E (Playwright)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          (npx vite preview --outDir dist-e2e --port 4173 --strictPort &) && sleep 3
          npm run e2e
        env:
          E2E_RELATORIO: "1"
          E2E_AMBIENTE: staging (GitHub Actions)
      - uses: actions/upload-artifact@v4
        if: always() && steps.cfg.outputs.ok == 'true'
        with:
          name: e2e
          path: |
            web/e2e/resultados/relatorio
            web/e2e/resultados/artefatos
            web/docs/E2E.md
            web/docs/e2e-prints
          if-no-files-found: ignore
