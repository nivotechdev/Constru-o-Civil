# X16: every push and pull request touching web/ is checked the way a contributor checks locally —
# typecheck, lint, format, unit tests, the three builds (demo, real, standalone; L01: the real one fails
# without its variables), the SQL tests on a
# Supabase-like Postgres, and Lighthouse on a phone profile. The standalone preview is published as an
# artifact (it is no longer kept in Git).
name: web

on:
  push:
    paths: ["web/**", "supabase/migrations/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "supabase/migrations/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build (demonstração)
        run: npm run build:demo
      # L01: o build de produção sem as variáveis tem de falhar (nunca sai um app de demonstração por engano).
      - name: Build de produção sem variáveis falha
        run: |
          if npx vite build --outDir dist-sem-env > build-sem-env.log 2>&1; then
            echo "O build de produção passou sem as variáveis" && exit 1
          fi
          grep -q "Build de produção interrompido" build-sem-env.log && cat build-sem-env.log | head -8
      - name: Build (modo real)
        run: npm run build -- --outDir dist-real
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_SITE_URL: https://bicos.example.com
          VITE_TURNSTILE_SITE_KEY: ci-placeholder
          VITE_SENTRY_DSN: https://ci@sentry.example.com/1
      - name: Build (prévia que abre do disco)
        run: npm run build:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: bicos-preview
          path: web/dist-standalone/index.html
      - name: Lighthouse (celular)
        run: |
          npx --yes lighthouse@12.8.2 --version
          (npx vite preview --port 4173 --strictPort &) && sleep 3
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://localhost:4173/ --quiet --form-factor=mobile \
              --throttling-method=devtools --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path=lighthouse-$i.json
          done
          node scripts/lighthouse-check.mjs lighthouse-1.json lighthouse-2.json lighthouse-3.json
      - name: Acessibilidade (axe, WCAG 2.1 AA)
        run: |
          npm i --no-save axe-core@4.10.3
          npx playwright install chromium
          curl -sf http://localhost:4173/ > /dev/null || ((npx vite preview --port 4173 --strictPort &) && sleep 3)
          node scripts/a11y-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse-*.json
          if-no-files-found: ignore

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Postgres do Supabase + migrations
        run: ./supabase/tests/local/setup.sh
      - name: Testes SQL
        run: node supabase/tests/run.mjs supabase/tests/[a-z]*.sql
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      # X14: os tipos do banco no app (src/types/database.generated.ts) têm de estar iguais às migrations.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: APLICAR-TUDO.sql em dia
        run: node scripts/aplicar-tudo.mjs && git diff --exit-code -- supabase/APLICAR-TUDO.sql
      - name: Tipos do banco em dia
        run: npm run gen:types && git diff --exit-code -- src/types/database.generated.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
