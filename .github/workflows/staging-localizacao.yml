# U77 — Põe as vagas e os endereços do staging no ponto certo com o geocodificador do U76 (o mesmo do app).
# Só manual (Actions › staging-localizacao › Run workflow): não roda a cada envio ao master. "ensaio" só mostra o que
# mudaria. O relatório fica no resumo da execução (dos endereços de conta, só o começo do id).
name: staging-localizacao

on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Só mostrar o que mudaria, sem gravar"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  relocalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      # A conexão do banco do staging (a mesma das migrations): não depende do token da API do Supabase.
      DB_URL: ${{ secrets.STAGING_DB_URL }}
      # Só para o app saber que está no modo real (services/mode.ts); o script não chama o Supabase por eles.
      VITE_SUPABASE_URL: https://setyxomsbfrkneqqfoam.supabase.co
      VITE_SUPABASE_ANON_KEY: nao-usada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Relocalizar vagas e endereços
        env:
          ENSAIO: ${{ inputs.ensaio && '1' || '' }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Falta o segredo STAGING_DB_URL."; exit 1; }
          command -v psql >/dev/null || sudo apt-get install -y postgresql-client
          npx vite-node scripts/staging/relocalizar.ts
