# R08: site de TESTE no GitHub Pages (https://nivotechdev.github.io/Constru-o-Civil/), ligado ao STAGING.
# Faz o build do app (web/) e publica o resultado — sem isso o Pages mostra só o README do repositório.
# Uma vez só, no GitHub: Settings › Pages › Build and deployment › Source: "GitHub Actions".
# Só valores públicos aqui (a chave anon do staging vai para o navegador de qualquer jeito). Nunca a produção:
# o site da produção é o Cloudflare Pages (web/docs/IMPLANTACAO.md › 7).
name: site

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      VITE_BASE: /Constru-o-Civil/
      VITE_SUPABASE_URL: https://setyxomsbfrkneqqfoam.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldHl4b21zYmZya25lcXFmb2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODE5NTYsImV4cCI6MjEwNzc1Nzk1Nn0.vFOevVQ3V55yXcb44BkpLuHKp9wd1bXNsRk5dglpGOE
      VITE_SITE_URL: https://nivotechdev.github.io/Constru-o-Civil
      # Chave de TESTE do Turnstile (sempre passa) — o staging usa a secret de teste.
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # Sem Sentry no staging por enquanto: endereço que não existe (.invalid), só para o build aceitar.
      VITE_SENTRY_DSN: https://publica@sentry.invalid/1
      VITE_SENTRY_ENVIRONMENT: staging
      VITE_SUPORTE_WHATSAPP: "54994731661"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:staging
      - name: Não publicar a demonstração (armadilha 1)
        run: grep -rqE 'https://setyxomsbfrkneqqfoam\.supabase\.co' dist/assets/*.js
      # O Pages não tem "rewrite": qualquer endereço do app (/Constru-o-Civil/mural, /v/…) cai no 404.html,
      # que é o próprio app — o roteador lê o caminho e abre a tela certa.
      # O <base> faz os links relativos (ícones, manifest) funcionarem também quando o 404.html abre num caminho fundo.
      - run: sed 's#<head>#<head><base href="/Constru-o-Civil/">#' dist/index.html > dist/404.html && grep -q '<base href' dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
