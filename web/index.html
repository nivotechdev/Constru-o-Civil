<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bicos — diárias de obra perto de você</title>
    <meta
      name="description"
      content="Bicos conecta construtoras a trabalhadores da construção civil para diárias avulsas."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    />
  </head>
  <body class="bg-concrete-50 text-concrete-700 font-body">
    <!-- Z11: shown before any JavaScript runs (slow phone, bad signal); React replaces it on start. -->
    <div id="app">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          background: #1d4bed;
          color: #fff;
          font:
            700 3rem/1 Barlow,
            'Helvetica Neue',
            Arial,
            sans-serif;
          letter-spacing: -0.02em;
        "
      >
        Bicos
        <span
          style="
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-right-color: transparent;
            border-radius: 50%;
            animation: bicos-spin 0.8s linear infinite;
          "
        ></span>
      </div>
      <style>
        @keyframes bicos-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <noscript>
      <p
        style="
          font:
            16px/1.5 system-ui,
            sans-serif;
          max-width: 32rem;
          margin: 2rem auto;
          padding: 0 1.5rem;
        "
      >
        A Bicos precisa do JavaScript ligado no navegador para funcionar.
      </p>
    </noscript>
    <script>
      // This is the development source: it only runs through Vite (npm run dev). Opened straight from
      // disk it would stay blank, so say where the ready-to-open app is.
      if (location.protocol === 'file:')
        document.getElementById('app').innerHTML =
          '<div style="font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;color:#2f3742">' +
          '<h1 style="font-size:1.4rem;color:#101418">Este arquivo precisa do servidor de desenvolvimento</h1>' +
          '<p>Para abrir o app direto no navegador, use o <b>index.html</b> da raiz do projeto (ou <b>web/preview/index.html</b>).</p>' +
          '<p>Para desenvolver: <code>cd web &amp;&amp; npm install &amp;&amp; npm run dev</code></p></div>';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
