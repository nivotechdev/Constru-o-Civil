      content="A Valorjob conecta empresas e pessoas que precisam de um serviço a trabalhadores que procuram bico e diárias."
    />

      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/barlow/files/barlow-latin-700-normal.woff2"
    />

      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-400-normal.woff2"

          </svg>
          <p class="boot-text">Bicos e diárias perto de você. Sem taxa para o trabalhador.</p>
        </div>
        <span class="boot-spin"></span>
      </div>
      <style>
        .boot {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: #1d4bed;
          color: #fff;
          text-align: center;
        }
        .boot-mid {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          padding: 0 24px;
        }
        .boot-logo {
          display: block;
          height: 52px;
          width: auto;
          max-width: 100%;
        }
        .boot-text {
          margin: 0;
          max-width: 20rem;
          font:
            400 1rem/1.5rem 'Plus Jakarta Sans',
            'Segoe UI',
            Arial,
            sans-serif;
          color: rgba(255, 255, 255, 0.85);
        }
        .boot-spin {
          align-self: center;
          margin-bottom: 64px;
          width: 28px;
          height: 28px;
          border: 3px solid rgba(255, 255, 255, 0.9);
          border-right-color: transparent;
          border-radius: 50%;
          animation: bicos-spin 0.8s linear infinite;
        }
        @media (min-width: 640px) {
          .boot-text {
            max-width: 24rem;
            font-size: 1.125rem;
            line-height: 1.75rem;
          }
        }
        @keyframes bicos-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <noscript>
      <p
        style="
          font:
            16px/1.5 system-ui,
            sans-serif;
          max-width: 32rem;
          margin: 2rem auto;
          padding: 0 1.5rem;
        "
      >
        A Valorjob precisa do JavaScript ligado no navegador para funcionar.
      </p>
    </noscript>
    <script>
      // This is the development source: it only runs through Vite (npm run dev). Opened straight from
      // disk it would stay blank, so say where the ready-to-open app is.
      if (location.protocol === 'file:')
        document.getElementById('app').innerHTML =
          '<div style="font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1.5rem;color:#2f3742">' +
          '<h1 style="font-size:1.4rem;color:#101418">Este arquivo precisa do servidor de desenvolvimento</h1>' +
          '<p>Para abrir o app direto do disco, gere a prévia com <code>npm run build:standalone</code> (<b>dist-standalone/index.html</b>) ou baixe o artefato <b>bicos-preview</b> do CI.</p>' +
          '<p>Para desenvolver: <code>cd web &amp;&amp; npm install &amp;&amp; npm run dev</code></p></div>';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
